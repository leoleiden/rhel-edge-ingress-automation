---
- name: Enterprise Zero-Trust Edge Gateway Deployment
  hosts: edge_gateway
  become: true
  gather_facts: true

  vars:
    app_dir: "/opt/ukrpay-core"
    nginx_conf_dir: "/etc/nginx/conf.d"

  tasks:
    # ==========================================================================
    # БЛОК 1: Hardening безпеки (SELinux & Firewalld)
    # ==========================================================================
    - name: Ensure SELinux boolean 'httpd_can_network_connect' is permanently enabled
      ansible.posix.seboolean:
        name: httpd_can_network_connect
        state: true
        persistent: true
      tags: [security, selinux]

    - name: Ensure Firewalld service is running and enabled
      ansible.builtin.service:
        name: firewalld
        state: started
        enabled: true
      tags: [security, firewall]

    - name: Allow HTTP (80) and HTTPS (443) traffic through Firewalld permanently
      ansible.posix.firewalld:
        service: "{{ item }}"
        permanent: true
        immediate: true
        state: enabled
      loop:
        - http
        - https
      tags: [security, firewall]

    # ==========================================================================
    # БЛОК 2: Розгортання Core Banking API (Docker Compose Backend)
    # ==========================================================================
    - name: Create destination directory for Core API backend
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'
      tags: [backend, docker]

    - name: Copy Docker backend files to target node
      ansible.builtin.copy:
        src: "../docker/backend/"
        dest: "{{ app_dir }}/"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0644'
      tags: [backend, docker]

    - name: Deploy and start Core API containers via Docker Compose
      ansible.builtin.command:
        cmd: docker compose up -d --build --remove-orphans
        chdir: "{{ app_dir }}"
      register: compose_output
      changed_when: "'Started' in compose_output.stderr or 'Built' in compose_output.stderr"
      tags: [backend, docker]

    # ==========================================================================
    # БЛОК 3: Встановлення та налаштування Nginx Ingress Gateway
    # ==========================================================================
    - name: Install Nginx web server
      ansible.builtin.dnf:
        name: nginx
        state: present
      tags: [ingress, nginx]

    - name: Remove default Nginx config to prevent server_name '_' conflicts
      ansible.builtin.file:
        path: /etc/nginx/conf.d/default.conf
        state: absent
      notify: Reload Nginx
      tags: [ingress, nginx]

    - name: Deploy hardened OWASP/PCI-DSS Nginx gateway configuration
      ansible.builtin.copy:
        src: "../nginx/conf.d/ukrpay-gateway.conf"
        dest: "{{ nginx_conf_dir }}/ukrpay-gateway.conf"
        owner: root
        group: root
        mode: '0644'
      notify: Reload Nginx
      tags: [ingress, nginx]

    - name: Validate Nginx configuration syntax
      ansible.builtin.command: nginx -t
      changed_when: false
      tags: [ingress, nginx]

    - name: Ensure Nginx is enabled and running
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true
      tags: [ingress, nginx]

  handlers:
    - name: Reload Nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded
