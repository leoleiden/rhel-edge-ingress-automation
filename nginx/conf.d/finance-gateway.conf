# ==============================================================================
# FINANCE Enterprise Zero-Trust Edge Gateway
# Component: Nginx Reverse Proxy Configuration
# Security Standard: OWASP Top 10 / PCI DSS Hardened Baseline
# ==============================================================================

# Оптимізація з'єднань із бекендом (High Availability & Performance)
upstream core_banking_api {
    server 127.0.0.1:8080 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _; # Catch-all для Edge Gateway

    # --------------------------------------------------------------------------
    # 1. PCI DSS & Security Hardening
    # --------------------------------------------------------------------------
    # Приховуємо версію Nginx (захист від автоматизованих сканерів вразливостей)
    server_tokens off;

    # OWASP Security Headers (Захист від XSS, Clickjacking, MIME-sniffing)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'self';" always;

    # --------------------------------------------------------------------------
    # 2. DoS & Slowloris Attack Mitigation (Таймаути та ліміти буферів)
    # --------------------------------------------------------------------------
    client_max_body_size 10m;        # Обмеження розміру тіла запиту (захист від переповнення)
    client_body_buffer_size 128k;
    client_body_timeout 12s;         # Таймаут на прийом тіла запиту
    client_header_timeout 12s;       # Таймаут на прийом заголовків
    keepalive_timeout 15s;           # Час життя Keep-Alive з'єднання з клієнтом
    send_timeout 10s;

    # --------------------------------------------------------------------------
    # 3. Kubernetes / Load Balancer Health Check Endpoint
    # --------------------------------------------------------------------------
    # Використовується для перевірки життєздатності шлюзу (без спаму в логах)
    location /healthz {
        access_log off;
        return 200 "OK - FINANCE Edge Gateway Operational\n";
        add_header Content-Type text/plain;
    }

    # --------------------------------------------------------------------------
    # 4. Zero-Trust Reverse Proxy Routing
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://core_banking_api;
        proxy_http_version 1.1;
        proxy_set_header Connection ""; # Необхідно для роботи upstream keepalive

        # Прокидання реальних IP та заголовків клієнта для аудиту в Core API
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Жорсткі таймаути для проксі-з'єднань (щоб завислий бекенд не поклав Nginx)
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }
}
